name: Daily Signals historical research
on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC; the gate below selects 05:00 Europe/London.
    - cron: '0 4,5 * * *'
permissions:
  contents: read
jobs:
  london-time-gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || [[ "$(TZ=Europe/London date +%H)" == "05" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Not 05:00 Europe/London; skipping this UTC slot."
          fi
  validate:
    needs: london-time-gate
    if: needs.london-time-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - name: Download independent historical CSVs
        run: |
          mkdir -p historical reports
          for season in 2022-23 2023-24 2024-25; do
            curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/footballcsv/cache.wfb/master/${season}/eng.1.csv" -o "historical/${season}__eng.1.csv"
          done
      - name: Validate historical baseline
        run: python scripts/validate_history.py historical/*.csv --output reports/baseline.json
      - name: Compare Bayesian research model
        run: python scripts/compare_models.py historical/*.csv --output reports/bayes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-signals-historical-research
          path: reports/
          if-no-files-found: warn
