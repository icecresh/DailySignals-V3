name: Daily Signals V3 daily multi-model research
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4,5 * * *'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: London schedule gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || [[ "$(TZ=Europe/London date +%H)" == "05" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Install model dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install scikit-learn lightgbm xgboost catboost
      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q
      - name: Run chronological multi-model evaluation and fixture research
        if: steps.gate.outputs.run == 'true'
        run: python scripts/v3_pipeline.py --out reports/v3
      - name: Upload reports
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v3-multimodel-${{ github.run_id }}
          path: reports/v3/
          if-no-files-found: warn
