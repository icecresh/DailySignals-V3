name: Daily Signals V3 daily multi-model research
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
      timezone: 'Europe/London'
permissions:
  contents: write
concurrency:
  group: daily-signals-v3-ledger
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install scikit-learn lightgbm xgboost catboost
      - name: Unit tests
        run: python -m pytest -q
      - name: Run chronological multi-model evaluation and fixture research
        run: |
          UK_DATE=$(TZ=Europe/London date +%F)
          python scripts/v3_pipeline.py --date "$UK_DATE" --out reports/v3
      - name: Prepare human-readable daily ledger
        run: python scripts/publish_daily_report.py --report reports/v3/report.json --out reports/v3
      - name: Freeze daily ledger in GitHub
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(python -c 'import json; print(json.load(open("reports/v3/report.json"))["date"])')
          DEST="daily_ledgers/${DAY}"
          if [[ -e "$DEST" ]]; then
            echo "Ledger already exists: $DEST. Not overwriting."
            exit 0
          fi
          mkdir -p "$DEST"
          cp reports/v3/report.json reports/v3/NORMAL_SIGNALS.md reports/v3/research_candidates.json reports/v3/manifest.json reports/v3/evaluated_cells.json reports/v3/production_audit.json "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Freeze Daily Signals V3 research ledger for $DAY"
          git fetch origin main
          if git cat-file -e "origin/main:${DEST}/manifest.json" 2>/dev/null; then
            echo "Remote ledger already frozen: $DEST. Not overwriting."
            exit 0
          fi
          git push origin HEAD:main
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-multimodel-${{ github.run_id }}
          path: reports/v3/
          if-no-files-found: warn
