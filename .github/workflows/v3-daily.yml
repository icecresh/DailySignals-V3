name: Daily Signals V3 daily multi-model research
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4,5 * * *'
permissions:
  contents: write
concurrency:
  group: daily-signals-v3-ledger
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: London schedule gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Match the scheduled UTC slot to UK winter/summer offset, not runner start hour.
          # This tolerates GitHub Actions queue delays without running twice daily.
          SLOT="${{ github.event.schedule }}"
          OFFSET="$(TZ=Europe/London date +%z)"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || [[ "$SLOT" == "0 4,5 * * *" && "$OFFSET" == "+0100" && "$(date -u +%H)" == "04" ]] || [[ "$SLOT" == "0 4,5 * * *" && "$OFFSET" == "+0000" && "$(date -u +%H)" == "05" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Install model dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install scikit-learn lightgbm xgboost catboost
      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q
      - name: Run chronological multi-model evaluation and fixture research
        if: steps.gate.outputs.run == 'true'
        run: |
          UK_DATE=$(TZ=Europe/London date +%F)
          python scripts/v3_pipeline.py --date "$UK_DATE" --out reports/v3
      - name: Prepare human-readable daily ledger
        if: steps.gate.outputs.run == 'true'
        run: python scripts/publish_daily_report.py --report reports/v3/report.json --out reports/v3
      - name: Freeze daily ledger in GitHub
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(python -c 'import json; print(json.load(open("reports/v3/report.json"))["date"])')
          DEST="daily_ledgers/${DAY}"
          if [[ -e "$DEST/manifest.json" ]]; then
            echo "Ledger already exists: $DEST. Not overwriting."
            exit 0
          fi
          mkdir -p "$DEST"
          cp reports/v3/report.json reports/v3/NORMAL_SIGNALS.md reports/v3/research_candidates.json reports/v3/manifest.json "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Freeze Daily Signals V3 research ledger for $DAY"
          git push origin HEAD:main
      - name: Upload reports
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v3-multimodel-${{ github.run_id }}
          path: reports/v3/
          if-no-files-found: warn
